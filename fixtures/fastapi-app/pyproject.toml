[tool.poetry]
name = "fastapi-app"
version = "0.1.0"
description = "Curated FastAPI test application with intentional signals"
authors = ["ELCODE Studio <contact@elcode.id>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
requests = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

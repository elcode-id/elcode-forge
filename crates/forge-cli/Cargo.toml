[package]
name = "forge-cli"
description = "Primary CLI binary (eforge / elcode-forge) for ELCODE Forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "eforge"

[[bin]]
name = "eforge"
path = "src/main.rs"

[[bin]]
name = "elcode-forge"
path = "src/bin/elcode-forge.rs"

[dependencies]
forge-core.workspace = true
forge-analyzer.workspace = true
forge-git.workspace = true
forge-rules.workspace = true
forge-security.workspace = true
forge-ai.workspace = true
forge-mcp.workspace = true
schemars = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tiny_http = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/eforge-v{ version }-{ target }.{ archive-format }"
bin-dir = "eforge-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

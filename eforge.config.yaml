# ELCODE Forge (eforge) — Self-Dogfooding Configuration
version: "1"

project_name: "elcode-forge"
languages:
  - "rust"
  - "typescript"

ignore_patterns:
  - "target/**"
  - "node_modules/**"
  - ".eforge/**"
  - "fixtures/**"

git_enabled: true
fail_on_severity: "high"

rules:
  quality/max-file-lines:
    enabled: true
    severity: "low"
    max_lines: 500

# Optional AI Assistant & Code Review Configuration (Phase 4)
# ai:
#   enabled: false
#   provider: "openai"              # openai | anthropic | gemini | openai-compatible | mock
#   model: "gpt-4o"

#   max_tokens: 1024
#   max_context_tokens: 8000
#   temperature: 0.2
#   timeout_secs: 30
#   cache_enabled: true
#   budget_daily_usd: 2.00

# Deep Security & Secret Scanner Configuration (Phase 8)
security:
  allowlist:
    - "fixtures/**"
    - "tests/**"
    - "**/tests/**"
    - "packaging/**"
    - "docs/**"

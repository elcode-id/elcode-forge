[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-analyzer",
    "crates/forge-git",
    "crates/forge-rules",
    "crates/forge-security",
    "crates/forge-mcp",
    "crates/forge-ai",
    "crates/forge-cli",
    "crates/forge-server",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/elcode-id/elcode-forge"
authors = ["R. Luki Rahayu Agung / ELCODE"]

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-analyzer = { path = "crates/forge-analyzer" }
forge-git = { path = "crates/forge-git" }
forge-rules = { path = "crates/forge-rules" }
forge-security = { path = "crates/forge-security" }
forge-mcp = { path = "crates/forge-mcp" }
forge-ai = { path = "crates/forge-ai" }
forge-server = { path = "crates/forge-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
blake3 = "1.5"
schemars = { version = "0.8", features = ["derive"] }
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
regex = "1.11"
toml = "0.8"
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros"] }
jsonwebtoken = "9.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

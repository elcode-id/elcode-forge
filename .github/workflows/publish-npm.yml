name: Publish to npm (elcode-forge)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish elcode-forge to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm CLI to latest (npm v11+ required for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies & run tests
        working-directory: packages/forge-cli-npm
        run: |
          npm ci || npm install
          npm run test
          npm run check

      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: packages/forge-cli-npm
        run: |
          npm --version
          npm publish --access public --provenance

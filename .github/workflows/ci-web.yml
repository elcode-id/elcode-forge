name: CI — Web, Dashboard & Schemas

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.8.1"

jobs:
  web-verify:
    name: Lint, Typecheck, Test & Schema Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (for schema drift check)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Schema drift check
        shell: bash
        run: |
          cargo run --bin eforge -- schema -o packages/forge-schema/schema/report-bundle.schema.json.tmp
          diff -u packages/forge-schema/schema/report-bundle.schema.json packages/forge-schema/schema/report-bundle.schema.json.tmp || {
            echo "ERROR: Schema drift detected! Run 'cargo run --bin eforge -- schema -o packages/forge-schema/schema/report-bundle.schema.json' and commit the update."
            exit 1
          }
          rm -f packages/forge-schema/schema/report-bundle.schema.json.tmp

      - name: Lint workspace packages
        run: pnpm run lint

      - name: Typecheck workspace packages
        run: pnpm run check

      - name: Run unit & schema tests
        run: pnpm run test

      - name: Build workspace packages
        run: pnpm run build

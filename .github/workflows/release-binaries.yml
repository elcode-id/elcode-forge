name: Release — Cross-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries (eforge & elcode-forge)
        run: cargo build --release --locked --target ${{ matrix.target }} --package forge-cli

      - name: Package Unix archive & SHA-256 checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="eforge-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/eforge" "$STAGE_DIR/"
          cp "target/${{ matrix.target }}/release/elcode-forge" "$STAGE_DIR/"
          cp README.md LICENSE "$STAGE_DIR/"
          ARCHIVE_NAME="${STAGE_DIR}.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$STAGE_DIR"
          shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Package Windows archive & SHA-256 checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $StageDir = "eforge-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/eforge.exe" "$StageDir/"
          Copy-Item "target/${{ matrix.target }}/release/elcode-forge.exe" "$StageDir/"
          Copy-Item "README.md", "LICENSE" "$StageDir/"
          $ArchiveName = "$StageDir.zip"
          Compress-Archive -Path "$StageDir/*" -DestinationPath $ArchiveName -Force
          $Hash = (Get-FileHash -Algorithm SHA256 $ArchiveName).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -Encoding ascii "$ArchiveName.sha256"

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            eforge-*.tar.gz
            eforge-*.zip
            eforge-*.sha256
          retention-days: 30

  publish-release-assets:
    name: Publish Release Assets & SHA256SUMS
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" eforge-*.tar.gz eforge-*.zip SHA256SUMS.txt --clobber

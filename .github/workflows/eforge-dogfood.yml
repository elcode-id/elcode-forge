name: CI — Self-Dogfooding (eforge)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  CARGO_TERM_COLOR: always

jobs:
  dogfood:
    name: Self-Dogfood ELCODE Forge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Build eforge release binary
        run: cargo build --release --bin eforge

      - name: Dogfood 1 — Run eforge doctor on ELCODE Forge workspace
        run: ./target/release/eforge doctor --path . --format terminal

      - name: Dogfood 2 — Run eforge scan on ELCODE Forge workspace
        run: ./target/release/eforge scan --path . --format terminal

      - name: Dogfood 3 — Run composite GitHub Action on fixtures/next-app
        uses: ./integrations/github-action
        with:
          command: doctor
          path: fixtures/next-app
          step-summary: "true"

      - name: Dogfood 4 — Generate deterministic report bundle
        run: ./target/release/eforge report --path . --output forge-report.json

      - name: Setup Node & pnpm for dashboard
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard SPA
        run: pnpm --filter @elcode-forge/dashboard run build

      - name: Upload Report Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-report-bundle
          path: forge-report.json
          if-no-files-found: error

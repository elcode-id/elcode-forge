apiVersion: v1
kind: Secret
metadata:
  name: forge-server-secret
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-server
    app.kubernetes.io/part-of: elcode-forge
type: Opaque
stringData:
  # Database connection string (PostgreSQL)
  EFORGE_DATABASE_URL: "postgres://forge:forge_production_password_change_me@forge-postgres:5432/forge_db"
  # JWT signing secret (minimum 32 characters)
  EFORGE_JWT_SECRET: "replace_with_strong_production_jwt_signing_secret_32chars_min"
  # Bootstrap administrative API key
  EFORGE_ADMIN_API_KEY: "replace_with_secure_admin_api_key_for_bootstrapping"
